name: Build standalone packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.builder }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
        builder: [pyinstaller, nuitka]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python requirements
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          dotnet tool install --global wix
          Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\Inno Setup 6'
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.dotnet\tools"

      - name: Configure the Windows C compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Linux AppImage tool
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            --output "$RUNNER_TEMP/linuxdeploy"
          chmod +x "$RUNNER_TEMP/linuxdeploy"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build all native formats
        run: python build.py --method "${{ matrix.builder }}" --format all

      - name: Upload installers and portable archive
        uses: actions/upload-artifact@v4
        with:
          name: deepzoom-cleaner-${{ runner.os }}-${{ matrix.builder }}
          path: dist-packages/**
          if-no-files-found: error
